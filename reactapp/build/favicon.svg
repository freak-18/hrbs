<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hotelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#hotelGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Hotel building -->
  <rect x="18" y="20" width="28" height="24" fill="#fff" rx="2"/>
  
  <!-- Hotel windows -->
  <rect x="22" y="24" width="4" height="4" fill="#0066cc" rx="1"/>
  <rect x="30" y="24" width="4" height="4" fill="#0066cc" rx="1"/>
  <rect x="38" y="24" width="4" height="4" fill="#0066cc" rx="1"/>
  
  <rect x="22" y="32" width="4" height="4" fill="#0066cc" rx="1"/>
  <rect x="30" y="32" width="4" height="4" fill="#0066cc" rx="1"/>
  <rect x="38" y="32" width="4" height="4" fill="#0066cc" rx="1"/>
  
  <!-- Hotel door -->
  <rect x="28" y="38" width="8" height="6" fill="#ff6b35" rx="1"/>
  <circle cx="34" cy="41" r="0.5" fill="#fff"/>
  
  <!-- Star -->
  <polygon points="32,12 33.5,16 37,16 34.5,18.5 35.5,22 32,20 28.5,22 29.5,18.5 27,16 30.5,16" fill="#ffd700"/>
  
  <!-- ZEN text -->
  <text x="32" y="54" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#fff">ZEN</text>
</svg>